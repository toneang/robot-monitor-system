<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Keyboard Teleop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/teleop.css" />
</head>
<body>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <main class="shell">
    <header class="hero">
      <h1>Robot Teleop Panel</h1>
      <p>打开此页面后，点击一次页面使其获得焦点，然后直接使用键盘控制机器人。</p>
    </header>

    <section class="status-grid">
      <article class="card">
        <span class="label">连接状态</span>
        <strong id="connectionStatus" class="value warning">检测中...</strong>
      </article>
      <article class="card">
        <span class="label">当前模式</span>
        <strong id="modeStatus" class="value">-</strong>
      </article>
      <article class="card">
        <span class="label">最近动作</span>
        <strong id="lastAction" class="value">-</strong>
      </article>
      <article class="card">
        <span class="label">Base Pose</span>
        <strong id="basePose" class="value">-</strong>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>键位映射</h2>
        <p>按键将触发对应后端动作接口 <code>POST /api/teleop/action</code>。</p>
      </div>

      <div class="keymap-grid" id="keymapGrid"></div>
    </section>

    <section class="panel tips">
      <h2>使用说明</h2>
      <p>1. 首次进入页面后，先单击页面任意处，让浏览器接收键盘事件。</p>
      <p>2. 建议在本页面前台操作，避免快捷键被其他窗口拦截。</p>
      <p>3. <code>1</code> 切到导航模式，<code>2</code> 切到操作模式。</p>
      <p>4. 如机器人未初始化、未归位或急停触发，后端会返回错误提示。</p>
    </section>
  </main>

  <script type="module" src="/static/teleop.js"></script>
</body>
</html>
